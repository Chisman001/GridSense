datasets:
  test_energy:
    file: test_energy_data.csv
    enabled: true
    numeric_columns:
      - square_footage
      - number_of_occupants
      - appliances_used
      - energy_consumption
      - average_temperature
    datetime_columns: []
    id_columns: []
    categorical_columns:
      building_type:
        - Residential
        - Commercial
        - Industrial
    ranges:
      square_footage:
        min: 0
      number_of_occupants:
        min: 0
      appliances_used:
        min: 0
      energy_consumption:
        min: 0
      average_temperature:
        min: -20
        max: 60
    categories:
      building_type:
        - Residential
        - Commercial
        - Industrial
    duplicate_checks:
      unique_ids: []
      timestamps: {}
    required_columns:
      - building_type
      - square_footage
      - number_of_occupants
      - appliances_used
      - average_temperature
      - energy_consumption
    remove_duplicates: true
    remove_empty_rows: true
    trim_strings: true
    replace_missing_values: true
    ratio_checks:
      - numerator: number_of_occupants
        denominator: square_footage
        maximum_ratio: 1
        description: occupancy densities

  energy_consumption:
    file: energy_consumption.csv
    enabled: true
    numeric_columns:
      - building_size_m2
      - occupants
      - energy_cost_brl
    datetime_columns: []
    id_columns:
      - customer_id
    categorical_columns:
      customer_type:
        - residential
        - commercial
        - industrial
      regions:
        - Northeast
        - Midwest
        - Southeast
        - North
        - South
    ranges:
      building_size_m2:
        min: 0
      occupants:
        min: 0
      energy_cost_brl:
        min: 0
    categories:
      customer_type:
        - residential
        - commercial
        - industrial
      regions:
        - Northeast
        - Midwest
        - Southeast
        - North
        - South
    duplicate_checks:
      unique_ids:
        - customer_id
      timestamps: {}
    required_columns:
      - customer_id
      - customer_type
      - regions
      - building_size_m2
      - occupants
      - energy_cost_brl
    remove_duplicates: true
    remove_empty_rows: true
    trim_strings: true
    replace_missing_values: true
    ratio_checks:
      - numerator: occupants
        denominator: building_size_m2
        maximum_ratio: 1
        description: occupancy densities

